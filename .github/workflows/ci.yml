name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # The image was previously never built in CI, so a go.mod toolchain bump that
  # the Dockerfile could not satisfy was only discovered during a deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t genai-observability-app:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh
      # A diagram that drifts from its source is how the architecture starts
      # describing a system that does not exist.
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: ./scripts/check-diagram.sh
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
      - run: grep -RInE '(^|[|;&[:space:]])python([[:space:]]|$)' scripts && exit 1 || true
